name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the workspace libs (@workspace/db, api-zod, api-client) so their
      # dist/*.d.ts exist, then typechecks every app. dist is gitignored, so this
      # build must run before any app typecheck.
      - name: Typecheck (libs + apps)
        run: pnpm run typecheck

      - name: Unit tests (api-server)
        run: pnpm --filter @workspace/api-server run test
