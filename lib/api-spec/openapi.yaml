openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Volunteer Service Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: events
    description: Calendar event operations
  - name: submissions
    description: Volunteer submission operations
  - name: supervisor
    description: Supervisor operations
  - name: admin
    description: Admin operations
  - name: dashboard
    description: Dashboard operations
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all calendar events
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "403":
          description: Forbidden

  /v1/events/my-registrations:
    get:
      operationId: listMyRegistrations
      tags: [events]
      summary: List the current participant's event registrations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventRegistration"

  /v1/events/{eventId}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found

    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an existing event (admin only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "403":
          description: Forbidden
        "404":
          description: Not found

    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event (admin only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Forbidden

  /v1/events/{eventId}/register:
    post:
      operationId: registerForEvent
      tags: [events]
      summary: Register for an upcoming event (participant)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRegistration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/events/{eventId}/checkin:
    post:
      operationId: checkInToEvent
      tags: [events]
      summary: Check in to a day-of event (participant)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
        "400":
          description: Outside time window or not registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/submissions:
    get:
      operationId: listMySubmissions
      tags: [submissions]
      summary: List the current participant's submissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"

    post:
      operationId: submitInternalHours
      tags: [submissions]
      summary: Submit actual hours worked for a past registered event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Hours already submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/supervisor/submissions:
    get:
      operationId: listPendingSubmissions
      tags: [supervisor]
      summary: List all pending submissions (supervisor/admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionDetail"

  /v1/supervisor/submissions/{submissionId}/review:
    put:
      operationId: reviewSubmission
      tags: [supervisor]
      summary: Approve or reject a submission
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/supervisor/history:
    get:
      operationId: listReviewedSubmissions
      tags: [supervisor]
      summary: List reviewed submissions (supervisor/admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionDetail"

  /v1/external-submissions:
    get:
      operationId: listMyExternalSubmissions
      tags: [submissions]
      summary: List my external volunteer submissions (participant)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalSubmission"

    post:
      operationId: submitExternalActivity
      tags: [submissions]
      summary: Submit an external volunteer activity (participant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalSubmissionInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalSubmission"
        "400":
          description: Validation error

  /v1/supervisor/external-submissions:
    get:
      operationId: listPendingExternalSubmissions
      tags: [supervisor]
      summary: List pending external submissions (supervisor/admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalSubmissionDetail"

  /v1/supervisor/external-submissions/{externalSubmissionId}/review:
    put:
      operationId: reviewExternalSubmission
      tags: [supervisor]
      summary: Approve or reject an external submission (supervisor/admin)
      parameters:
        - name: externalSubmissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/supervisor/external-history:
    get:
      operationId: listReviewedExternalSubmissions
      tags: [supervisor]
      summary: List reviewed external submissions (supervisor/admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalSubmissionDetail"

  /v1/admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user with a specific role (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error

  /v1/admin/users/{userId}:
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/admin/users/{userId}/hours:
    get:
      operationId: listManualHours
      tags: [admin]
      summary: List manual hour credits for a participant (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualHoursCredit"
    post:
      operationId: addManualHours
      tags: [admin]
      summary: Add a manual hour credit for a participant (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualHoursInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualHoursCredit"
        "400":
          description: Validation error

  /v1/admin/hours/{creditId}:
    delete:
      operationId: deleteManualHours
      tags: [admin]
      summary: Delete a manual hour credit (admin only)
      parameters:
        - name: creditId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/admin/submissions/{submissionId}/override:
    put:
      operationId: overrideSubmission
      tags: [admin]
      summary: Override a submission status (admin only)
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"

  /v1/admin/organizations:
    post:
      operationId: createOrganization
      tags: [admin]
      summary: Create an organization (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Validation error

  /v1/admin/organizations/{organizationId}:
    put:
      operationId: updateOrganization
      tags: [admin]
      summary: Update an organization (admin only)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /v1/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Within-school participant leaderboard by approved hours
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

  /v1/leaderboard/schools:
    get:
      operationId: getSchoolStandings
      tags: [leaderboard]
      summary: Aggregate approved hours per school
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolStanding"

  /v1/parent/children:
    get:
      operationId: getParentChildren
      tags: [parent]
      summary: List a parent's linked children with schedule and progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentChild"

  /v1/dashboard/participant:
    get:
      operationId: getParticipantDashboard
      tags: [dashboard]
      summary: Get participant dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantDashboard"

  /v1/dashboard/supervisor:
    get:
      operationId: getSupervisorDashboard
      tags: [dashboard]
      summary: Get supervisor dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisorDashboard"

  /v1/dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Get admin dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.

components:
  schemas:
    Organization:
      type: object
      required: [organizationId, name, allowsElementary, allowsMiddle, allowsHigh]
      properties:
        organizationId:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        allowsElementary:
          type: boolean
        allowsMiddle:
          type: boolean
        allowsHigh:
          type: boolean
    OrganizationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
        allowsElementary:
          type: boolean
        allowsMiddle:
          type: boolean
        allowsHigh:
          type: boolean

    LeaderboardEntry:
      type: object
      required: [rank, displayName, totalApprovedHours, isMe]
      properties:
        rank:
          type: integer
        displayName:
          type: string
        grade:
          type: ["string", "null"]
        totalApprovedHours:
          type: number
        medal:
          type: ["string", "null"]
        isMe:
          type: boolean
    LeaderboardResponse:
      type: object
      required: [school, entries, myHours]
      properties:
        school:
          type: ["string", "null"]
        myRank:
          type: ["integer", "null"]
        myHours:
          type: number
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
    SchoolStanding:
      type: object
      required: [school, totalHours, avgHours, participantCount]
      properties:
        school:
          type: string
        totalHours:
          type: number
        avgHours:
          type: number
        participantCount:
          type: integer

    ParentChildRegistration:
      type: object
      required: [registrationId, eventId, status, isNew]
      properties:
        registrationId:
          type: string
        eventId:
          type: string
        eventTitle:
          type: ["string", "null"]
        eventDate:
          type: ["string", "null"]
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        status:
          type: string
        isNew:
          type: boolean
    ParentChild:
      type: object
      required: [userId, firstName, lastName, email, totalApprovedHours, upcomingRegistrations]
      properties:
        userId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        totalApprovedHours:
          type: number
        upcomingRegistrations:
          type: array
          items:
            $ref: "#/components/schemas/ParentChildRegistration"

    ManualHoursInput:
      type: object
      required: [hours, description, dateAwarded]
      properties:
        hours:
          type: number
          minimum: 0.5
          maximum: 500
        description:
          type: string
          minLength: 2
          maxLength: 300
        dateAwarded:
          type: string
    ManualHoursCredit:
      type: object
      required: [manualHoursId, userId, hours, description, dateAwarded, createdAt]
      properties:
        manualHoursId:
          type: string
        userId:
          type: string
        hours:
          type: number
        description:
          type: string
        dateAwarded:
          type: string
        awardedByName:
          type: ["string", "null"]
        createdAt:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - status
        - message

    RegisterInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
        lastName:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        accountType:
          type: string
          enum: [student, parent]
        parentEmail:
          type: string
          format: email
        school:
          type: string
        grade:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, role, firstName]
      properties:
        token:
          type: string
        role:
          type: string
        firstName:
          type: string
        userId:
          type: string

    UserProfile:
      type: object
      required: [userId, email, firstName, lastName, role, createdAt]
      properties:
        userId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        createdAt:
          type: string

    AdminCreateUserInput:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string

    Event:
      type: object
      required: [eventId, title, description, location, eventDate, startTime, endTime, hoursValue, maxCapacity, supervisorId, registrationCount]
      properties:
        eventId:
          type: string
        title:
          type: string
        description:
          type: string
        location:
          type: string
        eventDate:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        hoursValue:
          type: number
        maxCapacity:
          type: integer
        imageUrl:
          type: ["string", "null"]
        supervisorId:
          type: string
        supervisorName:
          type: ["string", "null"]
        supervisorEmail:
          type: ["string", "null"]
        registrationCount:
          type: integer
        myRegistrationStatus:
          type: ["string", "null"]
        organizationId:
          type: ["string", "null"]
        organizationName:
          type: ["string", "null"]
        eligibleForMe:
          type: boolean

    EventInput:
      type: object
      required: [title, description, location, eventDate, startTime, endTime, maxCapacity, supervisorId]
      properties:
        title:
          type: string
          maxLength: 150
        description:
          type: string
        location:
          type: string
        eventDate:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        maxCapacity:
          type: integer
        supervisorId:
          type: string
        imageUrl:
          type: string
